<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар — Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            background: #1a1a2e;
            border-radius: 12px;
        }
        h1 {
            font-size: 28px;
            color: #f0c040;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #2a2a4e;
            border-radius: 8px;
            background: #0a0a0f;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #f0c040;
        }
        .error-msg {
            background: #3e1a1a;
            border: 1px solid #6e2a2a;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #ff8888;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 45px;
        }
        .eye-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #888;
            padding: 5px 8px;
            transition: color 0.2s;
        }
        .eye-btn:hover {
            color: #f0c040;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-primary {
            background: #2a5a8e;
            color: white;
        }
        .btn-primary:hover { background: #356a9e; }
        .btn-secondary {
            background: #333;
            color: #ccc;
            font-size: 14px;
        }
        .btn-secondary:hover { background: #444; }
        .link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #6a9eff;
            text-decoration: none;
            font-size: 14px;
        }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 ВХОД</h1>

        {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" placeholder="Введи логин" required>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="login_password"
                           placeholder="Введи пароль" required>
                    <button type="button" class="eye-btn" onclick="togglePassword('login_password', this)">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <a href="/register/" class="link">Нет аккаунта? Зарегистрироваться</a>
        <a href="/" class="btn btn-secondary" style="text-decoration:none;text-align:center;">← Назад</a>
    </div>
    <script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
        } else {
            input.type = 'password';
            btn.textContent = '👁️';
        }
    }
    </script>
</body>
</html>
