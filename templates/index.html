<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 400px;
            padding: 20px;
            width: 100%;
        }

        /* Верхняя строка */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 40px;
        }
        .top-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
        }
        .btn-login {
            background: #2a5a8e;
        }
        .btn-login:hover { background: #356a9e; }
        .btn-register {
            background: #2a6e2a;
        }
        .btn-register:hover { background: #358535; }
        .btn-logout {
            background: #6e2a2a;
        }
        .btn-logout:hover { background: #8e3a3a; }
        .btn-profile {
            background: #4a2a6e;
        }
        .btn-profile:hover { background: #5a3a7e; }

        /* Заголовок */
        h1 {
            font-size: 48px;
            color: #f0c040;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 40px;
            font-size: 16px;
        }
        .user-info {
            color: #6a9eff;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Кнопки меню */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-new {
            background: #2a6e2a;
            color: white;
        }
        .btn-new:hover { background: #358535; }
        .btn-load {
            background: #2a4a6e;
            color: white;
        }
        .btn-load:hover { background: #355885; }
        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .hint-text {
            color: #666;
            font-size: 13px;
            margin-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Верхняя строка -->
        <div class="top-bar" id="topBar"></div>

        <!-- Заголовок -->
        <h1>КСИНГАР</h1>
        <p class="subtitle">Текстовая RPG-игра</p>

        <!-- Информация о пользователе -->
        <div class="user-info" id="userInfo"></div>

        <!-- Кнопки меню -->
        <div id="menuButtons"></div>
    </div>

    <script>
        // Информация о пользователе (из шаблона Django)
        const isAuthenticated = {{ user.is_authenticated|yesno:"true,false" }};
        const username = "{{ user.username|default:'' }}";
        const hasPlayers = {{ has_players|yesno:"true,false" }};

        const topBar = document.getElementById('topBar');
        const userInfo = document.getElementById('userInfo');
        const menuButtons = document.getElementById('menuButtons');

        if (isAuthenticated) {
            // Верхняя строка для залогиненных
            topBar.innerHTML = `
                <button class="top-btn btn-profile" onclick="goToProfile()">👤 ${username}</button>
                <button class="top-btn btn-logout" onclick="logout()">🚪 Выход</button>
            `;

            userInfo.textContent = `Добро пожаловать, ${username}!`;

            // Кнопки меню
            menuButtons.innerHTML = `
                <button class="btn btn-new" onclick="newGame()">🎮 НОВАЯ ИГРА</button>
                <button class="btn btn-load" onclick="loadGame()" ${!hasPlayers ? 'disabled' : ''}>
                    📂 ЗАГРУЗИТЬ${!hasPlayers ? ' (нет персонажей)' : ''}
                </button>
            `;
        } else {
            // Верхняя строка для незалогиненных
            topBar.innerHTML = `
                <button class="top-btn btn-login" onclick="goToLogin()">🔑 Войти</button>
                <button class="top-btn btn-register" onclick="goToRegister()">📝 Регистрация</button>
            `;

            userInfo.innerHTML = '';

            // Кнопки меню заблокированы
            menuButtons.innerHTML = `
                <button class="btn btn-new" disabled>🎮 НОВАЯ ИГРА</button>
                <button class="btn btn-load" disabled>📂 ЗАГРУЗИТЬ</button>
            `;

            // Подсказка
            const hint = document.createElement('p');
            hint.className = 'hint-text';
            hint.innerHTML = '⚠️ Для игры нужно войти или зарегистрироваться';
            menuButtons.appendChild(hint);
        }

        // ============ НАВИГАЦИЯ ============
        function goToLogin() {
            window.location.href = '/login/';
        }

        function goToRegister() {
            window.location.href = '/register/';
        }

        function goToProfile() {
            // Пока просто заглушка — потом экран профиля
            alert(`👤 Профиль: ${username}`);
        }

        function logout() {
            if (confirm('Выйти из аккаунта?')) {
                window.location.href = '/logout/';
            }
        }

        function newGame() {
            window.location.href = '/intro/';
        }

        function loadGame() {
            window.location.href = '/load-game/';
        }
    </script>
</body>
</html>
