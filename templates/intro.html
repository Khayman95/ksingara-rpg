<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар — Интро</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            text-align: center;
        }
        .wizard-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .wizard-img {
            width: 150px;
            height: 300px;
            background: #1a1a2e;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 48px;
            flex-shrink: 0;
        }
        .wizard-text {
            text-align: left;
            flex-grow: 1;
        }
        .wizard-name {
            font-size: 24px;
            color: #f0c040;
            margin-bottom: 15px;
        }
        .wizard-message {
            font-size: 16px;
            line-height: 1.6;
            color: #ccc;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            background: #2a6e2a;
            color: white;
            transition: background 0.2s;
            text-decoration: none;
        }
        .btn:hover { background: #358535; }
    </style>
</head>
<body>
    <div class="container">
        <div class="wizard-section">
            <!-- Картинка волшебника (пока заглушка) -->
            <div class="wizard-img">🧙‍♂️</div>

            <div class="wizard-text">
                <h2 class="wizard-name">Великий Рассказчик</h2>
                <p class="wizard-message">
                    Приветствую, странник...<br><br>
                    Я вижу в тебе искру приключений.
                    Но кто ты? Какова твоя суть?<br><br>
                    Давай узнаем...
                </p>
            </div>
        </div>

        <button class="btn" onclick="goToRaceSelect()">Понял, приступим!</button>
    </div>

    <script>
        function goToRaceSelect() {
            // Пока переходим по ссылке, потом будет динамически
            window.location.href = '/race-select/';
        }
    </script>

</body>
</html>
