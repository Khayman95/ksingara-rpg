<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар — Магическое благословение</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #f0c040;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .blessing-icon {
            text-align: center;
            font-size: 72px;
            margin-bottom: 20px;
        }
        .info-card {
            background: #1a1a2e;
            border: 1px solid #2a2a4e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
        }
        .info-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 28px;
            font-weight: bold;
            color: #aa88ff;
        }
        .requirement {
            font-size: 13px;
            color: #aaa;
            margin-top: 10px;
        }
        .requirement.met {
            color: #5e5;
        }
        .requirement.not-met {
            color: #e55;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        .btn-get {
            background: #8844cc;
            color: white;
        }
        .btn-get:hover:not(:disabled) { background: #9955dd; }
        .btn-get:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .btn-back {
            background: #333;
            color: #ccc;
        }
        .btn-back:hover { background: #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 МАГИЧЕСКОЕ БЛАГОСЛОВЕНИЕ</h1>
        <p class="subtitle">Благословение для магов, постигших тайны заклинаний</p>

        <div class="blessing-icon">🔮✨</div>

        <div class="info-card">
            <div class="info-label">Текущий уровень благословения</div>
            <div class="info-value" id="blessingLevel">0</div>
        </div>

        <div class="info-card">
            <div class="info-label">Требование</div>
            <div class="requirement" id="requirement">
                Нужно заклинание уровня 5+
            </div>
        </div>

        <button class="btn btn-get" id="getBtn" disabled onclick="getBlessing()">
            ✨ Получить благословение
        </button>

        <button class="btn btn-back" onclick="window.location.href='/circle-of-greats/'">
            ← Вернуться в Круг Великих
        </button>
    </div>

    <script>
        // Заглушка — потом будет API
        const spellLevel = 2;  // Уровень заклинания (тест)
        const blessingLevel = 0;

        document.getElementById('blessingLevel').textContent = blessingLevel;

        const req = document.getElementById('requirement');
        if (spellLevel >= 5) {
            req.textContent = '✅ Заклинание уровня ' + spellLevel + ' — условие выполнено!';
            req.className = 'requirement met';
            document.getElementById('getBtn').disabled = false;
        } else {
            req.textContent = '❌ Нужно заклинание уровня 5+. Сейчас: ' + spellLevel;
            req.className = 'requirement not-met';
        }

        function getBlessing() {
            alert('Благословение получено! (в разработке)');
        }
    </script>
    <script src="/static/js/autosave.js"></script>
    <script src="/static/js/navbar.js"></script>
</body>
</html>
