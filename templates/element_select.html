<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар — Выбор стихии</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            color: #6a9eff;
            margin-bottom: 20px;
        }
        .element-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .element-card {
            background: #1a1a2e;
            border: 2px solid #2a2a4e;
            border-radius: 12px;
            padding: 15px 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .element-card:hover {
            border-color: #6a9eff;
            background: #1e1e38;
            transform: scale(1.03);
        }
        .element-card.selected {
            border-color: #ff9f40;
            background: #1e1e20;
        }
        .element-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .element-name {
            font-size: 14px;
            color: #e0e0e0;
            font-weight: bold;
        }
        .element-type {
            font-size: 10px;
            color: #888;
            margin-top: 3px;
        }
        .desc-box {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 60px;
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .btn-next {
            background: #2a6e2a;
            color: white;
        }
        .btn-next:hover:not(:disabled) { background: #358535; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Выбери свою стихию</h1>

        <div class="element-grid" id="elementGrid"></div>

        <div class="desc-box" id="descBox">
            Выбери стихию, чтобы увидеть описание
        </div>

        <button class="btn btn-next" id="nextBtn" disabled onclick="goToFinalize()">
            Далее →
        </button>
    </div>

    <script>
        const elements = [
            { id: 'fire', name: 'Огонь (Игнис)', type: 'Основная', icon: '🔥', color: '#ffaa00', desc: 'Энергия, разрушение, созидание, тепло. Первородная стихия силы и жизни.' },
            { id: 'water', name: 'Вода (Акванис)', type: 'Основная', icon: '💧', color: '#4488ff', desc: 'Гибкость, течение, исцеление, интуиция. Стихия жизни и перемен.' },
            { id: 'wind', name: 'Ветер (Вентирис)', type: 'Основная', icon: '💨', color: '#cccccc', desc: 'Свобода, скорость, информация, мысль. Стихия разума и движения.' },
            { id: 'boiling_shadow', name: 'Кипящая Тень', type: 'Производная', icon: '🌑', color: '#6633aa', desc: 'Иллюзии, скрытность, мрак, поглощение. Рождена из пара и тьмы.' },
            { id: 'plasma', name: 'Плазма (Астралис)', type: 'Производная', icon: '⚡', color: '#aa44ff', desc: 'Звёздная материя, чистая энергия, технологии. Мост между магией и наукой.' },
            { id: 'ice', name: 'Лёд', type: 'Производная', icon: '❄️', color: '#88dddd', desc: 'Заморозка, кристаллизация, покой. Стихия абсолютного нуля.' },
            { id: 'storm', name: 'Гроза', type: 'Производная', icon: '🌩️', color: '#3355aa', desc: 'Молнии, буря, гнев, очищение. Ярость небес.' },
            { id: 'crystal_storm', name: 'Хрустальная Буря', type: 'Производная', icon: '💎', color: '#aaddff', desc: 'Ледяные кристаллы, световые иллюзии, хрупкость. Красота и опасность.' },
            { id: 'phoenix_blood', name: 'Кровь Феникса', type: 'Производная', icon: '🩸', color: '#cc3344', desc: 'Регенерация, перерождение, жизненная сила. Бессмертие через пламя и воду.' },
        ];

        let selectedElement = null;

        const grid = document.getElementById('elementGrid');
        elements.forEach(el => {
            const card = document.createElement('div');
            card.className = 'element-card';
            card.style.borderColor = el.color + '44';
            card.innerHTML = `
                <div class="element-icon">${el.icon}</div>
                <div class="element-name">${el.name}</div>
                <div class="element-type">${el.type}</div>
            `;
            card.onclick = () => selectElement(el, card);
            grid.appendChild(card);
        });

        function selectElement(element, card) {
            document.querySelectorAll('.element-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');

            document.getElementById('descBox').innerHTML = `
                <b style="color: ${element.color}">${element.name}</b>
                <br>${element.desc}
                <br><span style="font-size: 11px; color: #888;">Тип: ${element.type}</span>
            `;

            selectedElement = element;
            document.getElementById('nextBtn').disabled = false;

            localStorage.setItem('selectedElement', JSON.stringify(element));
        }

        function goToFinalize() {
            window.location.href = '/finalize/';
        }
    </script>

</body>
</html>
