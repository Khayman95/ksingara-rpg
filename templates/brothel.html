<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар — Бордель</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        h1 {
            font-size: 24px;
            color: #ff88aa;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .status-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: rgba(26, 26, 46, 0.95);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-label { font-size: 11px; color: #888; }
        .stat-value { font-size: 18px; font-weight: bold; margin-top: 3px; }
        .gold-value { color: #f0c040; }
        .rep-value { color: #ff88aa; }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            background: rgba(26, 26, 46, 0.95);
            border: 1px solid #2a2a4e;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
            color: #aaa;
            transition: all 0.2s;
        }
        .tab.active {
            background: rgba(62, 26, 42, 0.95);
            color: #ff88aa;
            border-color: #ff88aa;
        }
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .item-card {
            background: rgba(26, 26, 46, 0.95);
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .item-icon { font-size: 28px; }
        .item-info { flex-grow: 1; }
        .item-name { font-size: 14px; font-weight: bold; color: #e0e0e0; }
        .item-desc { font-size: 11px; color: #888; margin-top: 2px; }
        .item-price { font-size: 13px; color: #f0c040; font-weight: bold; }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-rest { background: #8e2a5a; color: white; }
        .btn-rest:hover:not(:disabled) { background: #9e3a6a; }
        .btn-rest:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-work { background: #6e4a2a; color: white; }
        .btn-work:hover { background: #8e5a3a; }

        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(51, 51, 51, 0.95);
            color: #ccc;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn-back:hover { background: rgba(68, 68, 68, 0.95); }

        .success-msg {
            text-align: center;
            color: #5e5;
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
        }

        .rep-progress {
            background: rgba(26, 26, 46, 0.95);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .rep-bar {
            background: #2a2a4e;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }
        .rep-fill {
            background: #ff88aa;
            height: 100%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="bg" style="position:fixed; inset:0; z-index:-1;"></div>

    <div class="container">
        <h1>💋 БОРДЕЛЬ "РОЗОВЫЙ ФОНАРЬ"</h1>
        <p class="subtitle">Отдохни, заработай, узнай секреты</p>

        <div class="status-bar">
            <div class="stat-card">
                <div class="stat-label">💰 Золото</div>
                <div class="stat-value gold-value" id="goldDisplay">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">⭐ Репутация</div>
                <div class="stat-value rep-value" id="repDisplay">0</div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('rest')">🛏️ Отдохнуть</div>
            <div class="tab" onclick="switchTab('work')">💼 Работать</div>
            <div class="tab" onclick="switchTab('rep')">⭐ Репутация</div>
        </div>

        <div class="items-list" id="itemsList"></div>

        <div class="success-msg" id="successMsg"></div>

        <a href="/living-district/" class="btn-back">← Вернуться в жилой район</a>
    </div>

    <script>
        let playerGold = 0;
        let reputation = 0;
        let currentTab = 'rest';
        let currentWork = null;

        const restOptions = [
            { id: 'relax', name: 'Расслабиться', icon: '🌸', desc: 'Бафф +10% к уклонению (3 боя)', price: 25, buff: 'dodge' },
            { id: 'luxury', name: 'VIP-комната', icon: '👑', desc: 'Бафф +20% к урону (3 боя)', price: 60, buff: 'damage' },
            { id: 'massage', name: 'Массаж', icon: '💆', desc: 'Восстанавливает HP/MP полностью', price: 40, buff: null, heal: true },
        ];

        const workOptions = [
            { id: 'entertainer', name: 'Развлекать гостей', icon: '🎭', desc: 'Пассивный доход: 5 золота', reward: 5, hours: 1 },
            { id: 'dancer', name: 'Танцевать', icon: '💃', desc: 'Пассивный доход: 15 золота', reward: 15, hours: 3 },
            { id: 'companion', name: 'Быть компаньоном', icon: '🥂', desc: 'Пассивный доход: 30 золота', reward: 30, hours: 6 },
        ];

        function getCsrfToken() {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, 10) === ('csrftoken=')) {
                        cookieValue = decodeURIComponent(cookie.substring(10));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function loadPlayerGold() {
            try {
                const response = await fetch('/api/player/stats/');
                const data = await response.json();
                if (data.success) {
                    playerGold = data.gold;
                    updateDisplays();
                }
            } catch(e) {
                console.error('Ошибка загрузки золота:', e);
            }
        }

        function updateDisplays() {
            document.getElementById('goldDisplay').textContent = playerGold;
            document.getElementById('repDisplay').textContent = reputation;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderItems();
        }

        function renderItems() {
            const container = document.getElementById('itemsList');
            container.innerHTML = '';

            if (currentTab === 'rest') {
                restOptions.forEach(opt => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <div class="item-icon">${opt.icon}</div>
                        <div class="item-info">
                            <div class="item-name">${opt.name}</div>
                            <div class="item-desc">${opt.desc}</div>
                        </div>
                        <div class="item-price">${opt.price}💰</div>
                        <button class="btn btn-rest" ${playerGold < opt.price ? 'disabled' : ''} onclick="restOption('${opt.id}')">
                            Выбрать
                        </button>
                    `;
                    container.appendChild(card);
                });
            } else if (currentTab === 'work') {
                if (currentWork && currentWork.has_work) {
                    if (currentWork.finished) {
                        container.innerHTML = `
                            <div style="text-align:center;padding:30px;">
                                <div style="font-size:48px;">🎉</div>
                                <div style="font-size:16px;color:#f0c040;margin-top:15px;">
                                    ${currentWork.name}
                                </div>
                                <div style="font-size:14px;color:#5e5;margin-top:5px;">
                                    Работа завершена! +${currentWork.reward}💰
                                </div>
                                <button class="btn btn-work" style="margin-top:20px;padding:12px 30px;"
                                        onclick="claimWork()">
                                    Забрать ${currentWork.reward}💰
                                </button>
                            </div>
                        `;
                    } else {
                        const minutes = Math.ceil(currentWork.remaining_seconds / 60);
                        const hours = Math.floor(minutes / 60);
                        const mins = minutes % 60;

                        container.innerHTML = `
                            <div style="text-align:center;padding:30px;">
                                <div style="font-size:48px;">⏳</div>
                                <div style="font-size:16px;color:#f0c040;margin-top:15px;">
                                    ${currentWork.name}
                                </div>
                                <div style="font-size:14px;color:#888;margin-top:5px;">
                                    Осталось: ${hours > 0 ? hours + ' ч ' : ''}${mins} мин
                                </div>
                            </div>
                        `;
                    }
                    return;
                }

                workOptions.forEach(opt => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <div class="item-icon">${opt.icon}</div>
                        <div class="item-info">
                            <div class="item-name">${opt.name}</div>
                            <div class="item-desc">${opt.desc} (${opt.hours} ч.)</div>
                        </div>
                        <button class="btn btn-work" onclick="workShift('${opt.id}')">
                            Работать
                        </button>
                    `;
                    container.appendChild(card);
                });
            } else if (currentTab === 'rep') {
                container.innerHTML = `
                    <div class="rep-progress">
                        <div style="font-size:14px;color:#e0e0e0;">Репутация: <b style="color:#ff88aa">${reputation}</b></div>
                        <div style="font-size:11px;color:#888;margin-top:5px;">
                            ${reputation < 10 ? '🆕 Новичок' :
                              reputation < 25 ? '⭐ Постоянный клиент' :
                              reputation < 50 ? '⭐⭐ Уважаемый гость' :
                              '⭐⭐⭐ VIP'}
                        </div>
                    </div>
                `;
            }
        }

        async function restOption(optId) {
            console.log('🔍 restOption вызван:', optId);

            const opt = restOptions.find(o => o.id === optId);
            if (!opt) {
                console.log('❌ Опция не найдена');
                return;
            }

            if (playerGold < opt.price) {
                showSuccess('❌ Недостаточно золота!');
                return;
            }

            try {
                console.log('📤 Отправка запроса...');

                const response = await fetch('/api/brothel-rest/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken(),
                    },
                    body: JSON.stringify({
                        price: opt.price,
                        heal_full: opt.heal || false,
                    }),
                });

                console.log('📥 Ответ:', response.status);

                const result = await response.json();
                console.log('📦 Данные:', result);

                if (result.success) {
                    showSuccess('✅ ' + result.message);
                    await loadPlayerGold();
                    renderItems();
                } else {
                    showSuccess('❌ ' + result.message);
                }
            } catch(e) {
                console.error('❌ Ошибка:', e);
                showSuccess('❌ Ошибка');
            }
        }

        async function workShift(optId) {
            const opt = workOptions.find(o => o.id === optId);
            if (!opt) return;

            try {
                const response = await fetch('/api/brothel-work-start/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken(),
                    },
                    body: JSON.stringify({
                        reward: opt.reward,
                        hours: opt.hours,
                        name: opt.name,
                    }),
                });
                const result = await response.json();

                if (result.success) {
                    showSuccess('✅ ' + result.message);
                    await checkWorkStatus();
                    renderItems();
                } else {
                    showSuccess('❌ ' + result.message);
                }
            } catch(e) {
                showSuccess('❌ Ошибка');
            }
        }

        async function checkWorkStatus() {
            try {
                const response = await fetch('/api/brothel-work-status/');
                const data = await response.json();

                if (!data.has_work) {
                    currentWork = null;
                    return;
                }

                currentWork = data;
            } catch(e) {
                console.error(e);
            }
        }

        async function claimWork() {
            try {
                const response = await fetch('/api/brothel-work-claim/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken(),
                    },
                    body: JSON.stringify({}),
                });
                const result = await response.json();

                if (result.success) {
                    showSuccess('✅ ' + result.message);
                    await loadPlayerGold();
                    await checkWorkStatus();
                    renderItems();
                } else {
                    showSuccess('❌ ' + result.message);
                }
            } catch(e) {
                showSuccess('❌ Ошибка');
            }
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            setTimeout(() => el.textContent = '', 2000);
        }

        async function init() {
            await loadPlayerGold();
            await checkWorkStatus();
            renderItems();
        }

        init();
    </script>

    <script src="/static/js/pixelbg.all.js"></script>
    <script src="/static/js/city_bg.js"></script>
    <script src="/static/js/navbar.js"></script>
</body>
</html>
