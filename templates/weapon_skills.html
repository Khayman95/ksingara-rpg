<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар — Навыки оружия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #f0c040;
            margin-bottom: 20px;
        }
        .placeholder {
            font-size: 64px;
            margin-bottom: 15px;
        }
        .desc {
            font-size: 15px;
            color: #888;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            background: #333;
            color: #ccc;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-back:hover { background: #444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="placeholder">⚔️</div>
        <h1>Изучение навыков оружия</h1>
        <p class="desc">Здесь можно будет освоить новые боевые приёмы.<br>В разработке...</p>
        <button class="btn-back" onclick="window.location.href='/circle-of-blades/'">← Вернуться</button>
    </div>
    <script src="/static/js/autosave.js"></script>
    <script src="/static/js/navbar.js"></script>
</body>
</html>
