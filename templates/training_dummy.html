<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар — Тренировочный манекен</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #f0c040;
            text-align: center;
            margin-bottom: 15px;
        }
        .dummy {
            text-align: center;
            font-size: 80px;
            margin-bottom: 20px;
            animation: shake 0.1s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .damage-display {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .damage-number {
            font-size: 48px;
            font-weight: bold;
            color: #ff5544;
        }
        .damage-label {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .skill-card {
            background: #1a1a2e;
            border: 2px solid #2a2a4e;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .skill-card:hover {
            border-color: #f0c040;
            background: #1e1e38;
        }
        .skill-card.selected {
            border-color: #ff5544;
            background: #2a1a1e;
        }
        .skill-icon {
            font-size: 32px;
            margin-bottom: 5px;
        }
        .skill-name {
            font-size: 14px;
            font-weight: bold;
            color: #e0e0e0;
        }
        .skill-cost {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        .btn-hit {
            background: #cc3322;
            color: white;
        }
        .btn-hit:hover { background: #dd4433; }
        .btn-hit:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .btn-back {
            background: #333;
            color: #ccc;
        }
        .btn-back:hover { background: #444; }
        .info-text {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 ТРЕНИРОВОЧНЫЙ МАНЕКЕН</h1>

        <!-- Манекен -->
        <div class="dummy" id="dummy">🗿</div>

        <!-- Отображение урона -->
        <div class="damage-display">
            <div class="damage-number" id="damageNumber">0</div>
            <div class="damage-label" id="damageLabel">Выбери навык и ударь</div>
        </div>

        <!-- Навыки -->
        <div class="skills-grid" id="skillsGrid"></div>

        <!-- Кнопка удара -->
        <button class="btn btn-hit" id="hitBtn" disabled onclick="hitDummy()">
            ⚔️ УДАРИТЬ
        </button>

        <button class="btn btn-back" onclick="window.location.href='/circle-of-blades/'">
            ← Вернуться в Круг Клинков
        </button>

        <div class="info-text">Манекен показывает урон без риска для здоровья</div>
    </div>

    <script>
        // Навыки игрока (заглушка — потом из API)
        const skills = [
            { id: 'power_strike', name: 'Мощный удар', icon: '⚔️', damage: 15, type: 'physical' },
            { id: 'fireball', name: 'Огненный шар', icon: '🔥', damage: 20, type: 'magic' },
            { id: 'water_blade', name: 'Водяной клинок', icon: '💧', damage: 12, type: 'magic' },
            { id: 'earth_shield', name: 'Земляной щит', icon: '🛡️', damage: 5, type: 'magic' },
        ];

        let selectedSkill = null;
        const dummy = document.getElementById('dummy');
        const damageNumber = document.getElementById('damageNumber');
        const damageLabel = document.getElementById('damageLabel');
        const hitBtn = document.getElementById('hitBtn');
        const skillsGrid = document.getElementById('skillsGrid');

        // Отрисовка навыков
        skills.forEach(skill => {
            const card = document.createElement('div');
            card.className = 'skill-card';
            card.innerHTML = `
                <div class="skill-icon">${skill.icon}</div>
                <div class="skill-name">${skill.name}</div>
                <div class="skill-cost">${skill.type === 'physical' ? 'Физический' : 'Магический'}</div>
            `;
            card.onclick = () => selectSkill(skill, card);
            skillsGrid.appendChild(card);
        });

        function selectSkill(skill, card) {
            document.querySelectorAll('.skill-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedSkill = skill;
            hitBtn.disabled = false;
            damageNumber.textContent = '0';
            damageLabel.textContent = `Выбран: ${skill.name}`;
        }

        function hitDummy() {
            if (!selectedSkill) return;

            // Анимация удара
            dummy.style.animation = 'none';
            setTimeout(() => {
                dummy.style.animation = 'shake 0.1s ease-in-out';
            }, 10);

            // Расчёт урона (можно позже усложнить)
            const baseDamage = selectedSkill.damage;
            const variance = Math.floor(Math.random() * 5) - 2;  // ±2
            const finalDamage = Math.max(1, baseDamage + variance);

            // Отображение
            damageNumber.textContent = finalDamage;
            damageNumber.style.color = selectedSkill.type === 'magic' ? '#aa88ff' : '#ff5544';
            damageLabel.textContent = `Урон навыком "${selectedSkill.name}"`;
        }
    </script>

    <script src="/static/js/autosave.js"></script>
    <script src="/static/js/navbar.js"></script>
</body>
</html>
