<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар — Административный район</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #f0c040;
            text-align: center;
            margin-bottom: 20px;
        }
        .district-card {
            background: #1a1a2e;
            border: 1px solid #2a2a4e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .district-card:hover {
            border-color: #4a6a9e;
            background: #1e1e38;
            transform: translateX(5px);
        }
        .district-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .district-name {
            font-size: 18px;
            font-weight: bold;
            color: #e0e0e0;
        }
        .district-desc {
            font-size: 13px;
            color: #888;
            margin-top: 5px;
            line-height: 1.4;
        }
        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            background: #333;
            color: #ccc;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
        }
        .btn-back:hover { background: #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ АДМИНИСТРАТИВНЫЙ РАЙОН</h1>

        <!-- Круг доступа -->
        <a href="/circle-of-access/" class="district-card">
            <div class="district-icon">🔮</div>
            <div class="district-name">Круг доступа</div>
            <div class="district-desc">Продажа предметов, вступление в Запредельщики, выход за барьер</div>
        </a>

        <!-- Круг Великих -->
        <a href="/circle-of-greats/" class="district-card">
            <div class="district-icon">🌟</div>
            <div class="district-name">Круг Великих</div>
            <div class="district-desc">Достижения, благословение (магия), изучение заклинаний</div>
        </a>

        <!-- Круг Клинков -->
        <a href="/circle-of-blades/" class="district-card">
            <div class="district-icon">⚔️</div>
            <div class="district-name">Круг Клинков</div>
            <div class="district-desc">Навыки оружия, тренировочный манекен, благословение (бой)</div>
        </a>

        <button class="btn-back" onclick="window.location.href='/city/'">← Вернуться в город</button>
    </div>

    <script src="/static/js/autosave.js"></script>
    <script src="/static/js/navbar.js"></script>
</body>
</html>
