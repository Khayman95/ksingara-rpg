<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар — Загрузка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #f0c040;
            text-align: center;
            margin-bottom: 20px;
        }
        .slot {
            background: #1a1a2e;
            border: 2px solid #2a2a4e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slot-num {
            font-size: 24px;
            font-weight: bold;
            color: #f0c040;
            width: 40px;
        }
        .slot-info {
            flex-grow: 1;
        }
        .slot-name {
            font-size: 16px;
            font-weight: bold;
            color: #e0e0e0;
        }
        .slot-desc {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }
        .slot.empty .slot-name { color: #666; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            color: white;
            margin-left: 5px;
        }
        .btn-load { background: #2a6e2a; }
        .btn-load:hover { background: #358535; }
        .btn-delete { background: #6e2a2a; }
        .btn-delete:hover { background: #8e3a3a; }
        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #333;
            color: #ccc;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
        }
        .btn-back:hover { background: #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📂 ЗАГРУЗИТЬ ИГРУ</h1>
        <div id="slots"></div>
        <button class="btn-back" onclick="window.location.href='/'">← Назад</button>
    </div>

    <script>
        async function loadSlots() {
            const response = await fetch('/api/player/list/');
            const data = await response.json();

            const container = document.getElementById('slots');
            container.innerHTML = '';

            data.players.forEach(p => {
                const slot = document.createElement('div');
                slot.className = 'slot' + (p.is_empty ? ' empty' : '');

                slot.innerHTML = `
                    <div class="slot-num">${p.slot}</div>
                    <div class="slot-info">
                        <div class="slot-name">${p.is_empty ? '[ПУСТО]' : p.name}</div>
                        <div class="slot-desc">${p.is_empty ? 'Слот пуст' : `${p.race} | ${p.element} | ${p.updated_at}`}</div>
                    </div>
                    ${!p.is_empty ? `
                        <button class="btn btn-load" onclick="loadSlot(${p.slot})">Загрузить</button>
                        <button class="btn btn-delete" onclick="deleteSlot(${p.slot})">✕</button>
                    ` : ''}
                `;

                container.appendChild(slot);
            });
        }

        async function loadSlot(slot) {
            const response = await fetch('/api/player/load/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({slot: slot}),
            });

            const data = await response.json();

            if (data.success) {
                // Переходим на сохранённый экран
                const screen = data.screen || 'map';
                const screenUrls = {
                    'map': '/map/',
                    'city': '/city/',
                    'trade_district': '/trade-district/',
                    'merchant': '/merchant/',
                    'blacksmith': '/blacksmith/',
                    'black_market': '/black-market/',
                    'admin_district': '/admin-district/',
                    'living_district': '/living-district/',
                    'tavern': '/tavern/',
                    'kennel': '/kennel/',
                    'brothel': '/brothel/',
                    'circle_of_access': '/circle-of-access/',
                    'circle_of_greats': '/circle-of-greats/',
                    'circle_of_blades': '/circle-of-blades/',
                    'weapon_skills': '/weapon-skills/',
                    'training_dummy': '/training-dummy/',
                    'blessing_check': '/blessing-check/',
                    'blessing_check_magic': '/blessing-check-magic/',
                    'character': '/character/',
                    'battle': '/battle/',
                    'codex': '/codex/',
                    // ✅ ДОБАВИТЬ:
                    'spell_library': '/spell-library/',
                    'achievements': '/achievements/',
                    'sell_items': '/sell-items/',
                    'join_beyonders': '/join-beyonders/',
                    'beyond_barrier': '/beyond-barrier/',
                };

                window.location.href = screenUrls[screen] || '/map/';
            } else {
                alert('Ошибка: ' + data.message);
            }
        }

        async function deleteSlot(slot) {
            if (!confirm(`Удалить персонажа из слота ${slot}?`)) return;

            const response = await fetch('/api/player/delete/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({slot: slot}),
            });

            const data = await response.json();

            if (data.success) {
                loadSlots();
            } else {
                alert('Ошибка: ' + data.message);
            }
        }

        loadSlots();
    </script>
</body>
</html>
