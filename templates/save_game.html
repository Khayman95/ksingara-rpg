<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар — Сохранение</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }
        h1 {
            font-size: 28px;
            color: #f0c040;
            text-align: center;
            margin-bottom: 10px;
        }
        .hint {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .slot {
            display: flex;
            align-items: center;
            background: #1a1a2e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            gap: 12px;
        }
        .slot-info {
            flex-grow: 1;
        }
        .slot-name {
            font-size: 16px;
            font-weight: bold;
            color: #e0e0e0;
        }
        .slot-name.empty {
            color: #666;
        }
        .slot-detail {
            font-size: 13px;
            color: #888;
            margin-top: 3px;
        }
        .slot-date {
            font-size: 11px;
            color: #555;
            margin-top: 2px;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-save {
            background: #2a5a8e;
            color: white;
        }
        .btn-save:hover { background: #356a9e; }
        .btn-delete {
            background: #6e2a2a;
            color: white;
        }
        .btn-delete:hover { background: #8e3a3a; }
        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #333;
            color: #ccc;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-back:hover { background: #444; }
        .success-msg {
            text-align: center;
            color: #5e5;
            font-size: 14px;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .success-msg.show { opacity: 1; }
        .btn-load {
            background: #2a6e2a;
            color: white;
        }
        .btn-load:hover { background: #358535; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💾 СОХРАНИТЬ ИГРУ</h1>
        <p class="hint">Выбери слот для сохранения персонажа</p>

        <div id="slots"></div>

        <div class="success-msg" id="successMsg">✅ Игра сохранена!</div>

        <button class="btn-back" onclick="goToMap()">🚶 Продолжить на карту</button>
    </div>

    <script src="/static/js/autosave.js"></script>
    <script>
        async function getSaves() {
            const response = await fetch('/api/saves/');
            return await response.json();
        }

        async function renderSlots() {
            const saves = await getSaves();
            const container = document.getElementById('slots');
            container.innerHTML = '';

            for (let i = 1; i <= 3; i++) {
                const save = saves[`slot${i}`];
                const slot = document.createElement('div');
                slot.className = 'slot';

                if (save && save.exists) {
                    slot.innerHTML = `
                        <div class="slot-info">
                            <div class="slot-name">Слот ${i}: ${save.name}</div>
                            <div class="slot-detail">${save.race} | ${save.element} | Ур.${save.level || 1}</div>
                            <div class="slot-date">${save.timestamp}</div>
                        </div>
                        <button class="btn btn-load" onclick="loadSlot(${i})">Загрузить</button>
                        <button class="btn btn-delete" onclick="deleteSave(${i})">✕</button>
                    `;
                } else {
                    slot.innerHTML = `
                        <div class="slot-info">
                            <div class="slot-name empty">Слот ${i}: [ПУСТО]</div>
                        </div>
                        <button class="btn btn-save" onclick="saveToSlot(${i})">Сохранить</button>
                    `;
                }

                container.appendChild(slot);
            }
        }

        async function saveToSlot(slot) {
            let race = {};
            let element = {};

            try {
                const raceStr = localStorage.getItem('selectedRace');
                if (raceStr && raceStr !== 'undefined' && raceStr !== 'null') {
                    race = JSON.parse(raceStr);
                }
            } catch(e) { race = {}; }

            try {
                const elemStr = localStorage.getItem('selectedElement');
                if (elemStr && elemStr !== 'undefined' && elemStr !== 'null') {
                    element = JSON.parse(elemStr);
                }
            } catch(e) { element = {}; }

            const name = localStorage.getItem('playerName') || 'Герой';
            const gender = localStorage.getItem('selectedGender') || 'male';
            const px = localStorage.getItem('playerX') || 13;
            const py = localStorage.getItem('playerY') || 13;

            const saveData = {
                name: name,
                gender: gender,
                race: (race && race.id) ? race.id : 'human',
                raceName: (race && race.name) ? race.name : 'Человек',
                element: (element && element.id) ? element.id : 'fire',
                elementName: (element && element.name) ? element.name : 'Огонь',
                stats: (race && race.stats) ? race.stats : {},
                level: 1,
                gold: 100,
                hp: 100,
                maxHp: 100,
                mp: 50,
                maxMp: 50,
                playerX: parseInt(px),
                playerY: parseInt(py),
                citySelected: true,
                currentScreen: typeof getCurrentScreen === 'function' ? getCurrentScreen() : 'city',
                timestamp: new Date().toLocaleString('ru-RU'),
            };

            const response = await fetch(`/api/save/${slot}/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(saveData),
            });

            const result = await response.json();
            if (result.success) {
                localStorage.setItem('activeSlot', slot);
                const msg = document.getElementById('successMsg');
                msg.classList.add('show');
                setTimeout(() => msg.classList.remove('show'), 2000);
                await renderSlots();
            }
        }

        async function loadSlot(slot) {
            const response = await fetch(`/api/load/${slot}/`);
            const result = await response.json();

            console.log('Загружено из API:', result);

            if (result.success && result.data) {
                const data = result.data;

                // Активный слот
                localStorage.setItem('activeSlot', slot);

                // Восстанавливаем данные
                localStorage.setItem('playerName', data.name || 'Герой');
                localStorage.setItem('selectedGender', data.gender || 'male');
                localStorage.setItem('playerX', data.playerX || 13);
                localStorage.setItem('playerY', data.playerY || 13);
                localStorage.setItem('citySelected', String(data.citySelected || false));

                // После восстановления данных:
                localStorage.setItem('lastScreen', screenUrls[screen] || '/city/');

                // Раса и стихия — сохраняем как строки + name
                const raceId = data.race || 'human';
                const raceName = data.raceName || 'Человек';
                localStorage.setItem('selectedRace', JSON.stringify({
                    id: raceId,
                    name: raceName,
                    stats: data.stats || {},
                    icon: '🧔'
                }));

                const elemId = data.element || 'fire';
                const elemName = data.elementName || 'Огонь';
                localStorage.setItem('selectedElement', JSON.stringify({
                    id: elemId,
                    name: elemName,
                    icon: '🔥'
                }));

                // Экран для восстановления
                const screen = data.currentScreen || 'city';
                console.log('Восстанавливаю экран:', screen);

                const screenUrls = {
                    'map': '/map/',
                    'city': '/city/',
                    'trade_district': '/trade-district/',
                    'merchant': '/merchant/',
                    'admin_district': '/admin-district/',
                    'living_district': '/living-district/',
                    'circle_of_blades': '/circle-of-blades/',
                    'circle_of_greats': '/circle-of-greats/',
                    'circle_of_access': '/circle-of-access/',
                    'weapon_skills': '/weapon-skills/',
                    'training_dummy': '/training-dummy/',
                    'blessing_check': '/blessing-check/',
                    'blessing_check_magic': '/blessing-check-magic/',
                    'character': '/character/',
                    'blacksmith': '/blacksmith/',
                    'black_market': '/black-market/',
                    'tavern': '/tavern/',
                    'brothel': '/brothel/',
                    'kennel': '/kennel/',
                };


                window.location.href = screenUrls[screen] || '/city/';
            } else {
                alert('Не удалось загрузить сохранение');
            }
        }

        async function deleteSave(slot) {
            if (confirm(`Удалить сохранение в слоте ${slot}?`)) {
                await fetch(`/api/delete-save/${slot}/`, { method: 'POST' });
                await renderSlots();
            }
        }

        function goToMap() {
            window.location.href = '/map/';
        }

        renderSlots();
    </script>
    <script src="/static/js/autosave.js"></script>
</body>
</html>
