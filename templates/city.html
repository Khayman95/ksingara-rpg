<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ксингар — Город</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        h1 {
            font-size: 26px;
            color: #f0c040;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        .assistant {
            display: flex;
            gap: 15px;
            background: rgba(26, 26, 46, 0.95);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            align-items: center;
        }
        .assistant-icon { font-size: 64px; }
        .assistant-name {
            font-size: 18px;
            color: #6a9eff;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .assistant-text {
            font-size: 14px;
            color: #aaa;
            line-height: 1.5;
        }
        .districts {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .district-card {
            background: rgba(26, 26, 46, 0.95);
            border: 1px solid #2a2a4e;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        .district-card:hover {
            border-color: #4a6a9e;
            background: rgba(30, 30, 56, 0.95);
        }
        .district-name {
            font-size: 16px;
            font-weight: bold;
            color: #e0e0e0;
        }
        .district-desc {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }
        .district-arrow {
            font-size: 20px;
            color: #666;
        }
        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(51, 51, 51, 0.95);
            color: #ccc;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
        }
        .btn-back:hover { background: rgba(68, 68, 68, 0.95); }
    </style>
    <script src="/static/js/pixelbg.all.js"></script>
</head>
<body>
    <div id="bg" style="position:fixed; inset:0; z-index:-1;"></div>

    <div class="container">
        <h1 id="cityName">🏰 Город</h1>

        <div class="assistant">
            <div class="assistant-icon">🧝‍♀️</div>
            <div class="assistant-info">
                <div class="assistant-name">Лиара</div>
                <div class="assistant-text" id="liaraText">Загрузка...</div>
            </div>
        </div>

        <div class="districts">
            <a href="/trade-district/" class="district-card">
                <div>
                    <div class="district-name">🛒 Торговый район</div>
                    <div class="district-desc">Торговец, кузнец, чёрный рынок</div>
                </div>
                <span class="district-arrow">→</span>
            </a>

            <a href="/admin-district/" class="district-card">
                <div>
                    <div class="district-name">🏛️ Административный район</div>
                    <div class="district-desc">Круг доступа, Круг Великих</div>
                </div>
                <span class="district-arrow">→</span>
            </a>

            <a href="/living-district/" class="district-card">
                <div>
                    <div class="district-name">🏘️ Жилой район</div>
                    <div class="district-desc">Питомник, таверна, бордель</div>
                </div>
                <span class="district-arrow">→</span>
            </a>
        </div>

        <button class="btn-back" onclick="window.location.href='/map/'">🚶 Выйти на карту</button>
    </div>

    <script src="/static/js/pixelbg.all.js"></script>
    <script>
        // Маппинг город → фон
        const CITY_BACKGROUNDS = {
            'Bergen': 'city_steampunk',
            'Laglou': 'city_magic',
            'Redania': 'city_hybrid',
        };

        async function init() {
            // Получаем данные о городе из API
            let cityId = localStorage.getItem('currentCityId');
            let cityName = localStorage.getItem('currentCity');

            // Если нет — запрашиваем у сервера
            if (!cityId) {
                try {
                    const response = await fetch('/api/current-city/');
                    const data = await response.json();
                    cityId = data.city_id;
                    cityName = data.city_name;

                    if (cityId) {
                        localStorage.setItem('currentCityId', cityId);
                        localStorage.setItem('currentCity', cityName);
                    }
                } catch(e) {
                    console.error('Ошибка получения города:', e);
                }
            }

            // Fallback
            cityId = cityId || 'Bergen';
            cityName = cityName || 'Город';

            // Название
            document.getElementById('cityName').textContent = '🏰 ' + cityName;

            // Фон
            const bgLocation = CITY_BACKGROUNDS[cityId] || 'city_magic';

            // Лиара
            const tips = [
                `Добро пожаловать в ${cityName}!`,
                'Сила влияет на урон и здоровье.',
                'Ловкость увеличивает уклонение.',
                'Интеллект влияет на магию и ману.',
            ];

            const visited = localStorage.getItem('cityVisited');
            if (!visited) {
                document.getElementById('liaraText').textContent =
                    'Привет! Я Лиара, твой ассистент. Если хочешь что-то узнать — спроси!';
                localStorage.setItem('cityVisited', 'true');
            } else {
                document.getElementById('liaraText').textContent =
                    tips[Math.floor(Math.random() * tips.length)];
            }
        }

        init();
    </script>
    <script src="/static/js/autosave.js"></script>
    <script src="/static/js/city_bg.js"></script>
    <script src="/static/js/navbar.js"></script>
</body>
</html>
